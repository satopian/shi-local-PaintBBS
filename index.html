					for (j = 0; docformsname.length > j; j++) {
						if (docformsname[j].value == val) {
							docformsname.selectedIndex = j; //プルダウンメニュー
						}
					}
				}
				const app_select = document.querySelector(".app_select");
				app_select.style.width = ((Number(w)) + 317) + "px";
			</script>
